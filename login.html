<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Policafé León</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #fdfbf7 0%, #f5f0ea 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .login-card {
            background: white;
            border-radius: 2rem;
            padding: 2.5rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
        }
        .input-field {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 1rem;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }
        .input-field:focus {
            outline: none;
            border-color: #ea580c;
            box-shadow: 0 0 0 4px rgba(234, 88, 12, 0.1);
        }
        .btn-primary {
            background: linear-gradient(135deg, #ea580c, #f59e0b);
            color: white;
            font-weight: bold;
            padding: 0.8rem;
            border-radius: 1rem;
            border: none;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(234, 88, 12, 0.3);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-8">
            <div class="text-5xl mb-2">🦁</div>
            <h1 class="text-3xl font-black text-neutral-800">Policafé</h1>
            <p class="text-sm text-neutral-500">El Rugido Innovador de la UPSLP</p>
            <div class="w-16 h-1 bg-gradient-to-r from-orange-600 to-amber-500 mx-auto rounded-full mt-3"></div>
        </div>

        <div class="flex bg-neutral-100 rounded-xl p-1 mb-6">
            <button onclick="mostrarLogin()" id="tab-login" class="flex-1 py-2.5 rounded-lg font-bold text-sm transition-all bg-orange-600 text-white">Iniciar Sesión</button>
            <button onclick="mostrarRegistro()" id="tab-register" class="flex-1 py-2.5 rounded-lg font-bold text-sm transition-all text-neutral-600">Registrarse</button>
        </div>

        <!-- LOGIN -->
        <div id="form-login">
            <div class="space-y-4">
                <div>
                    <label class="text-sm font-bold text-neutral-700 block mb-1.5">📧 Correo</label>
                    <input type="email" id="login-email" class="input-field" placeholder="ejemplo@upslp.edu.mx">
                </div>
                <div>
                    <label class="text-sm font-bold text-neutral-700 block mb-1.5">🔒 Contraseña</label>
                    <input type="password" id="login-password" class="input-field" placeholder="••••••••">
                </div>
                <button onclick="iniciarSesion()" class="btn-primary">🚀 Entrar</button>
                <div class="mt-4 p-3 bg-amber-50 rounded-xl border border-amber-200 text-xs text-amber-700 text-center">
                    <p class="font-bold">🔑 Admin:</p>
                    <p class="font-mono">admin@policafe.com / UPSLPCAFE</p>
                </div>
            </div>
        </div>

        <!-- REGISTRO -->
        <div id="form-register" style="display: none;">
            <div class="space-y-4">
                <div>
                    <label class="text-sm font-bold text-neutral-700 block mb-1.5">📋 Matrícula (6 dígitos)</label>
                    <input type="text" id="reg-matricula" class="input-field" placeholder="Ej: 202400" maxlength="6" pattern="[0-9]{6}">
                    <p class="text-[10px] text-neutral-400 mt-1">Ingresa tu matrícula de 6 dígitos</p>
                </div>
                <div>
                    <label class="text-sm font-bold text-neutral-700 block mb-1.5">👤 Nombre</label>
                    <input type="text" id="reg-nombre" class="input-field" placeholder="Tu nombre completo">
                </div>
                <div>
                    <label class="text-sm font-bold text-neutral-700 block mb-1.5">📧 Correo</label>
                    <input type="email" id="reg-email" class="input-field" placeholder="ejemplo@upslp.edu.mx">
                </div>
                <div>
                    <label class="text-sm font-bold text-neutral-700 block mb-1.5">🔒 Contraseña</label>
                    <input type="password" id="reg-password" class="input-field" placeholder="Mínimo 6 caracteres">
                </div>
                <button onclick="registrarUsuario()" class="btn-primary">🎉 Crear Cuenta</button>
            </div>
        </div>

        <div id="mensaje-estado" class="mt-4 text-center text-sm font-bold hidden"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBNMdhV48Y1oIEX-eZd20MOUuNPjoNQFXU",
            authDomain: "policafe-cf364.firebaseapp.com",
            projectId: "policafe-cf364",
            storageBucket: "policafe-cf364.firebasestorage.app",
            messagingSenderId: "1017727685183",
            appId: "1:1017727685183:web:ae7ac1a48ae19bbb345e8a",
            measurementId: "G-07QMKQV68B"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function mostrarLogin() {
            document.getElementById('form-login').style.display = 'block';
            document.getElementById('form-register').style.display = 'none';
            document.getElementById('tab-login').className = 'flex-1 py-2.5 rounded-lg font-bold text-sm transition-all bg-orange-600 text-white';
            document.getElementById('tab-register').className = 'flex-1 py-2.5 rounded-lg font-bold text-sm transition-all text-neutral-600';
        }

        function mostrarRegistro() {
            document.getElementById('form-login').style.display = 'none';
            document.getElementById('form-register').style.display = 'block';
            document.getElementById('tab-register').className = 'flex-1 py-2.5 rounded-lg font-bold text-sm transition-all bg-orange-600 text-white';
            document.getElementById('tab-login').className = 'flex-1 py-2.5 rounded-lg font-bold text-sm transition-all text-neutral-600';
        }

        function mostrarMensaje(texto, color) {
            const el = document.getElementById('mensaje-estado');
            el.textContent = texto;
            el.className = 'mt-4 text-center text-sm font-bold ' + color + ' block';
            setTimeout(() => el.className = 'mt-4 text-center text-sm font-bold hidden', 5000);
        }

        async function iniciarSesion() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            if (!email || !password) { mostrarMensaje('⚠️ Completa todos los campos', 'text-red-600'); return; }
            try {
                await auth.signInWithEmailAndPassword(email, password);
                mostrarMensaje('✅ ¡Bienvenido!', 'text-green-600');
                setTimeout(() => window.location.href = '/', 1000);
            } catch (error) {
                mostrarMensaje('❌ ' + error.message, 'text-red-600');
            }
        }

        async function registrarUsuario() {
            const matricula = document.getElementById('reg-matricula').value.trim();
            const nombre = document.getElementById('reg-nombre').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;

            if (!/^\d{6}$/.test(matricula)) {
                mostrarMensaje('⚠️ La matrícula debe ser de 6 dígitos', 'text-red-600');
                return;
            }
            if (!nombre || !email || !password) {
                mostrarMensaje('⚠️ Completa todos los campos', 'text-red-600');
                return;
            }
            if (password.length < 6) {
                mostrarMensaje('⚠️ La contraseña debe tener al menos 6 caracteres', 'text-red-600');
                return;
            }

            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const uid = userCredential.user.uid;
                await db.collection('usuarios').doc(uid).set({
                    nombre: nombre,
                    email: email,
                    matricula: matricula,
                    puntos: 0,
                    pedidosRealizados: 0,
                    rol: 'usuario',
                    fechaRegistro: firebase.firestore.FieldValue.serverTimestamp()
                });
                mostrarMensaje('✅ ¡Cuenta creada!', 'text-green-600');
                setTimeout(() => window.location.href = '/', 1000);
            } catch (error) {
                mostrarMensaje('❌ ' + error.message, 'text-red-600');
            }
        }

        auth.onAuthStateChanged(user => { if (user) window.location.href = '/'; });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (document.getElementById('form-login').style.display !== 'none') iniciarSesion();
                else registrarUsuario();
            }
        });
    </script>
</body>
</html>
